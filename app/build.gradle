plugins { id 'com.android.application' }

android {
    namespace 'com.creepingitreel.inventory'
    compileSdk 35

    defaultConfig {
        applicationId 'com.creepingitreel.inventory'
        minSdk 29
        targetSdk 35
        versionCode 6
        versionName '6.0'
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}
